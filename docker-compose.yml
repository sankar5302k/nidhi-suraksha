services:
  mongo:
    image: mongo:7
    container_name: nidhi_suraksha_mongo
    restart: always
    ports:
      - "127.0.0.1:27017:27017"
    volumes:
      - mongo_data:/data/db
      - ./mongo-init/mongo-keyfile:/etc/mongo/mongo-keyfile:ro
      - ./mongo-init/01-init-mongo.js:/docker-entrypoint-initdb.d/01-init-mongo.js:ro
      - ./mongo-init/entrypoint-rs.sh:/usr/local/bin/entrypoint-rs.sh:ro
    entrypoint: ["/bin/bash", "/usr/local/bin/entrypoint-rs.sh"]
    environment:
      - MONGO_INITDB_DATABASE=nidhi_suraksha

volumes:
  mongo_data:
    name: nidhi_suraksha_mongo_data
